<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

	<!-- Header Section -->
	<header>
		<h1>Rock, Paper, Scissors</h1>
		<p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
	</header>

	<!-- Player Section -->
	<section>
		<h2>Player Information</h2>
		<label for="playerName">Your name:</label>
		<input type="text" id="playerName" placeholder="Enter your name">
		<button onclick="startGame()">Start Game</button>
		<p id="welcome"></p>
	</section>

	<!-- Game Section -->
	<section>
		<h2>Choose Your Move</h2>
		<button onclick="playRound('rock')">Rock</button>
		<button onclick="playRound('paper') ">Paper</button>
		<button onclick="playRound('scissors') ">Scissors</button>

		<div class="choices">
			<div>
				<h3>You</h3>
				<img id="playerImg" src="rock.png" alt="Player Choice"> 
			</div>
			<div>
				<h3>Computer</h3>
				<img id="computerImg" src="rock.png" alt="Computer Choice"> 
			</div>
		</div>
	</section>

	<!-- Result Section -->
	<section>
		<h2>Results</h2>
		<p id="result"></p>
		<div class="scoreboard">
			Wins: <span id="wins">0</span>
			Losses: <span id="losses">0</span>
			Draws: <span id="draws">0</span>
		</div>
	</section>

	<!-- History Section -->
	<section>
            	<h2>History</h2>
            	<table id="history">
			<tr>
				<th>Round</th>
				<th>You</th>
				<th>Computer</th>
				<th>Result</th>
			</tr>
			<tbody id="historyBody"></tbody>
		</table>
		<br>
		
		<button onclick="showSummary()">Summary</button>
		<button onclick="resetGame()">Reset</button>

		<p id="summary"></p>
	</section>

	<!-- Footer Section -->
	<footer>
		<p id="startTime"></p>
		<p>&copy; 2026 Computer Science Club</p>
	</footer>

	<!-- Link to java script-->
	<script src="game.js"></script>

</body>
</html>
